name: hari-ci

on:
  push:
    branches: [hari-lab]
  pull_request:
    branches: [hari-lab]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: |
          php -l hari/core.php
          php -l hari/tests.php
          php -l hari/cli.php
          php -l hari/cli-test.php
          php -l hari/demo.php
          php -l hari/device.php
          php -l hari/device-test.php
          php -l hari/device-cli.php
          php -l hari/device-cli-test.php
          php -l hari/integration-test.php
          php -l hari/adversarial-test.php
          php -l hari/research-bench.php
          php -l hari/dialogue.php
          php -l hari/dialogue-test.php
          php -l hari/presence.php
          php -l hari/presence-test.php
          php -l hari/response.php
          php -l hari/response-test.php
      - name: Core tests
        run: php hari/tests.php
      - name: Protocol test
        run: php hari/cli-test.php
      - name: Device tests
        run: php hari/device-test.php
      - name: Device protocol test
        run: php hari/device-cli-test.php
      - name: Learned-language integration
        run: php hari/integration-test.php
      - name: Adversarial behavior
        run: php hari/adversarial-test.php
      - name: Longitudinal sanity benchmark
        run: php hari/research-bench.php
      - name: Conversational grounding
        run: php hari/dialogue-test.php
      - name: Presence and human response
        run: |
          php hari/presence-test.php
          php hari/response-test.php
      - name: End-to-end demo
        run: php hari/demo.php

  android-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build Android body
        run: gradle -p hari/android :app:testDebugUnitTest :app:assembleDebug --no-daemon
