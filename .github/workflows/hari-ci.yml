name: hari-ci

on:
  push:
    branches: [hari-lab, hari-step1-lab]
  pull_request:
    branches: [hari-lab, hari-step1-lab]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint existing HARI
        run: |
          php -l hari/core.php
          php -l hari/tests.php
          php -l hari/cli.php
          php -l hari/cli-test.php
          php -l hari/demo.php
          php -l hari/device.php
          php -l hari/device-test.php
          php -l hari/device-cli.php
          php -l hari/device-cli-test.php
          php -l hari/integration-test.php
          php -l hari/adversarial-test.php
          php -l hari/research-bench.php
          php -l hari/dialogue.php
          php -l hari/dialogue-test.php
          php -l hari/presence.php
          php -l hari/presence-test.php
          php -l hari/response.php
          php -l hari/response-test.php
      - name: Existing HARI regression suite
        run: |
          php hari/tests.php
          php hari/cli-test.php
          php hari/device-test.php
          php hari/device-cli-test.php
          php hari/integration-test.php
          php hari/adversarial-test.php
          php hari/research-bench.php
          php hari/dialogue-test.php
          php hari/presence-test.php
          php hari/response-test.php
          php hari/demo.php
      - name: Lint HARI Life MVP
        run: |
          php -l hari/life/frame.php
          php -l hari/life/memory.php
          php -l hari/life/brain.php
          php -l hari/life/tests.php
          php -l hari/life/adversarial.php
          php -l hari/life/benchmark.php
          php -l hari/life/cli.php
          php -l hari/life/demo.php
      - name: HARI Life unit and adversarial tests
        run: |
          php hari/life/tests.php
          php hari/life/adversarial.php
      - name: HARI Grounded World-Diff research tests
        run: |
          php hari/ground/tests.php
          php hari/ground/adversarial.php
      - name: HARI Embodied Mind unit tests
        run: |
          php tests/test_mind.php

  life-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Run fixed-budget life benchmark
        run: php hari/life/benchmark.php --json=/tmp/hari-life-result.json
      - name: Run capability demo
        run: php hari/life/demo.php
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: hari-life-mvp-benchmark
          path: /tmp/hari-life-result.json
          if-no-files-found: error
