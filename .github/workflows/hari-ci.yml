name: hari-ci

on:
  push:
    branches: [hari-lab]
  pull_request:
    branches: [hari-lab]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: |
          php -l hari/core.php
          php -l hari/tests.php
          php -l hari/cli.php
          php -l hari/cli-test.php
          php -l hari/demo.php
          php -l hari/device.php
          php -l hari/device-test.php
          php -l hari/device-cli.php
          php -l hari/device-cli-test.php
      - name: Core tests
        run: php hari/tests.php
      - name: Protocol test
        run: php hari/cli-test.php
      - name: Device tests
        run: php hari/device-test.php
      - name: Device protocol test
        run: php hari/device-cli-test.php
      - name: End-to-end demo
        run: php hari/demo.php
