name: hari-ci

on:
  push:
    branches: [hari-lab]
  pull_request:
    branches: [hari-lab]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint
        run: php -l hari/core.php && php -l hari/tests.php
      - name: Test
        run: php hari/tests.php
